services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-shield:latest
    container_name: fraud-shield-api
    ports:
      - "8000:8000"
    volumes:
      # Mount trained model artifacts from the host. Run `make train` first.
      - ./models:/app/models:ro
    environment:
      FRAUDSHIELD_RANDOM_SEED: "42"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: fraud-shield-app:latest
    container_name: fraud-shield-app
    ports:
      - "8501:8501"
    environment:
      FRAUDSHIELD_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fraud-shield-net
